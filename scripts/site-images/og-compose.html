<!doctype html>
<!--
  The social sharing image (1200 x 630). Background art comes from Higgsfield
  (scripts/site-images/og.ts); the words and logo are real type, laid over it
  here so they stay sharp. Render with scripts/site-images/og-render.mjs.
  ?bg=<path to art> picks the background.
-->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: hsl(220 25% 8%); --cyan: hsl(178 58% 56%); --orange: hsl(22 72% 56%); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  .card { position: relative; width: 1200px; height: 630px; font-family: Poppins, sans-serif; color: #eef4f4; }
  .art { position: absolute; inset: 0; background-size: cover; background-position: 70% 50%; }
  /* Keeps the left side dark enough for the headline whatever the art does. */
  .shade { position: absolute; inset: 0;
    background: linear-gradient(90deg, var(--bg) 0%, hsla(220 25% 8% / .92) 34%, hsla(220 25% 8% / .45) 58%, hsla(220 25% 8% / 0) 78%),
                linear-gradient(0deg, hsla(220 25% 8% / .7) 0%, hsla(220 25% 8% / 0) 30%); }
  .grid { position: absolute; inset: 0; opacity: .07;
    background-image: linear-gradient(var(--cyan) 1px, transparent 1px), linear-gradient(90deg, var(--cyan) 1px, transparent 1px);
    background-size: 48px 48px; mask-image: linear-gradient(90deg, #000 0%, transparent 55%); }
  .copy { position: absolute; left: 72px; top: 64px; bottom: 64px; width: 800px; display: flex; flex-direction: column; }
  .logo { height: 84px; width: auto; align-self: flex-start; }
  h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 84px; line-height: .98; letter-spacing: -2px; margin-top: auto; }
  h1 .end { display: block; color: #eef4f4; }
  h1 .on { display: block; color: var(--cyan); }
  h1 .on b { color: var(--orange); font-weight: 800; }
  .foot { margin-top: 34px; display: flex; align-items: center; gap: 18px; font-size: 21px; }
  .chip { background: var(--orange); color: var(--bg); font-weight: 600; padding: 10px 18px; }
  .url { color: #b9c3cf; font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <div class="art" id="art"></div>
  <div class="grid"></div>
  <div class="shade"></div>
  <div class="copy">
    <img class="logo" src="../../src/assets/dch-logo-primary.png" alt="">
    <h1><span class="end">Projects end.</span><span class="on">Momentum doesn't<b>.</b></span></h1>
    <div class="foot"><span class="chip">Free Growth Diagnostic</span><span class="url">digitalcreativeshubltd.com</span></div>
  </div>
</div>
<script>
  const bg = new URLSearchParams(location.search).get("bg");
  if (bg) document.getElementById("art").style.backgroundImage = `url("${bg}")`;
</script>
</body>
</html>
